summary: "Curso de Programación II del Bachillerato Técnico de Panamá, alineado con\
  \ la planificación didáctica anual del MEDUCA (Ministerio de Educación de Panamá\
  ), grado 11°. Apto para cualquier colegio del país. Cubre tres trimestres: (I) Introducció\
  n al lenguaje y estructuras básicas (variables, tipos de datos, operadores, expresiones\
  \ y sentencias de entrada/salida); (II) Estructuras de control (alternativas y repetitivas)\
  \ y subprogramas (funciones, subrutinas y uso crítico de asistentes de IA generativa);\
  \ (III) Arreglos unidimensionales y bidimensionales, además de estructuras de datos\
  \ abstractas (listas dinámicas, pilas y diccionarios). El lenguaje de referencia\
  \ es Python, elegido por su legibilidad y por su carácter multi-paradigma. Las competencias\
  \ trabajadas son: pensamiento lógico-matemático, tratamiento de la información y\
  \ competencia digital y aprender a aprender."
